<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-label="Cosine law: the same beam spread over a larger area at low altitude"><title>Cosine law: the same beam spread over a larger area at low altitude</title><defs><marker id="cos-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#26333e" stroke-width="1.5"/></marker><marker id="cos-arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#2479ad" stroke-width="1.5"/></marker><marker id="cos-arrow-azi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#007c9a" stroke-width="1.5"/></marker><marker id="cos-arrow-third" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#6a4fb3" stroke-width="1.5"/></marker><marker id="cos-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#607181" stroke-width="1.5"/></marker><marker id="cos-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#b13d4c" stroke-width="1.5"/></marker><pattern id="cos-hatch-shadow" patternUnits="userSpaceOnUse" width="3.4" height="3.4" patternTransform="rotate(45)"><rect width="3.4" height="3.4" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="3.4" stroke="#26333e" stroke-width="0.6"/></pattern><pattern id="cos-hatch-shade" patternUnits="userSpaceOnUse" width="7.5" height="7.5" patternTransform="rotate(45)"><rect width="7.5" height="7.5" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7.5" stroke="#26333e" stroke-width="0.6"/></pattern><pattern id="cos-hatch-screen" patternUnits="userSpaceOnUse" width="4.2" height="4.2" patternTransform="rotate(135)"><line x1="0" y1="0" x2="0" y2="4.2" stroke="#26333e" stroke-width="0.6"/></pattern></defs><rect id="cos-background" width="760" height="310" fill="#ffffff"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><g id="cos-high-sun"><text x="20" y="30" font-size="10.5" fill="#26333e" font-weight="700" letter-spacing="1.2">ITHACA, JUN 21 NOON · ALT 71°</text><path d="M16.85,250 Q179.61,250.3 342.37,250" fill="none" stroke="#26333e" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/><polygon points="147.11,108.17 210.56,108.17 161.73,250 98.27,250" fill="url(#cos-hatch-screen)" stroke="none"/><polygon points="147.11,108.17 210.56,108.17 161.73,250 98.27,250" fill="none" stroke="#2479ad" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><line x1="98.27" y1="250" x2="161.73" y2="250" stroke="#b13d4c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="130" y="272" font-size="12" fill="#26333e" text-anchor="middle">ground width = beam width / sin ALT = 1.06</text><path d="M132.27,250 A34,34 0 0 0 109.34,217.85" fill="none" stroke="#2479ad" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="92.27" y="242" font-size="12" fill="#2479ad" text-anchor="end" font-weight="700">ALT 71°</text><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="130" y="292" font-size="12" fill="#2479ad" text-anchor="middle" font-weight="600">G_h = G_n × sin ALT = 0.95 G_n</text></g><g id="cos-low-sun"><text x="380" y="30" font-size="10.5" fill="#