-size="12" fill="#26333e">(Eq. 22; the 4 m pole casts 6.6 m) and draw</text><text x="690" y="126" font-size="12" fill="#26333e">that ray. All other rays are parallel to it.</text><text x="668" y="168" font-size="16" fill="#2479ad" font-weight="700">2</text><text x="690" y="168" font-size="12" fill="#26333e">Through each base point draw a bearing line;</text><text x="690" y="183" font-size="12" fill="#26333e">through its top, a ray. Where they cross is</text><text x="690" y="198" font-size="12" fill="#26333e">the shadow point (1).</text><text x="668" y="240" font-size="16" fill="#2479ad" font-weight="700">3</text><text x="690" y="240" font-size="12" fill="#26333e">If the bearing line meets a wall first, turn</text><text x="690" y="255" font-size="12" fill="#26333e">up the wall until it meets the ray (2).</text><text x="668" y="312" font-size="16" fill="#2479ad" font-weight="700">4</text><text x="690" y="312" font-size="12" fill="#26333e">Connect the points. Edges parallel to the</text><text x="690" y="327" font-size="12" fill="#26333e">ground or to the wall cast parallel shadows:</text><text x="690" y="342" font-size="12" fill="#26333e">most of the outline is copied, not constructed.</text><text x="668" y="390" font-size="12" fill="#607181">ALT 31.2° · AZI 235.7° · tower 12 m · block 4.5 m</text></g></g></svg>
