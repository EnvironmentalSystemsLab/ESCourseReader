<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 395" role="img" aria-label="Stereographic projection of the sky hemisphere"><title>Stereographic projection of the sky hemisphere</title><defs><marker id="stc-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#26333e" stroke-width="1.5"/></marker><marker id="stc-arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#2479ad" stroke-width="1.5"/></marker><marker id="stc-arrow-azi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#007c9a" stroke-width="1.5"/></marker><marker id="stc-arrow-third" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#6a4fb3" stroke-width="1.5"/></marker><marker id="stc-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#607181" stroke-width="1.5"/></marker><marker id="stc-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#b13d4c" stroke-width="1.5"/></marker><pattern id="stc-hatch-shadow" patternUnits="userSpaceOnUse" width="3.4" height="3.4" patternTransform="rotate(45)"><rect width="3.4" height="3.4" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="3.4" stroke="#26333e" stroke-width="0.6"/></pattern><pattern id="stc-hatch-shade" patternUnits="userSpaceOnUse" width="7.5" height="7.5" patternTransform="rotate(45)"><rect width="7.5" height="7.5" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7.5" stroke="#26333e" stroke-width="0.6"/></pattern><pattern id="stc-hatch-screen" patternUnits="userSpaceOnUse" width="4.2" height="4.2" patternTransform="rotate(135)"><line x1="0" y1="0" x2="0" y2="4.2" stroke="#26333e" stroke-width="0.6"/></pattern></defs><rect id="stc-background" width="820" height="395" fill="#ffffff"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><g id="stc-section"><path d="M410,200 A150,150 0 0 0 110,200" fill="none" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M110,200 A150,150 0 0 0 410,200" fill="none" stroke="#a6bdce" stroke-width="0.6" stroke-dasharray="4 4" stroke-linecap="round" stroke-linejoin="round"/><path d="M67.8,200 Q259.83,200.47 451.87,200" fill="none" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="454" y="204" font-size="10.5" fill="#607181">horizon plane = chart</text><circle cx="260" cy="350" r="4" fill="#26333e" stroke="none"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="268" y="364" font-size="12" fill="#26333e">Nadir (projection point)</text><line x1="260" y1="350" x2="404.89" y2="161.18" stroke="#2479ad" stroke-width="1" opacity="0.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="404.89" cy="161.18" r="3" fill="#2479ad" stroke="none"/><circle cx="375.1" cy="200" r="3" fill="#6a4fb3" stroke="none"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="410.89" y="157.18" font-size="10.5" fill="#2479ad">15°</text><line x1="260" y1="350" x2="389.9" y2="125" stroke="#2479ad" stroke-width="1" opacity="0.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="389.9" cy="125" r="3" fill="#2479ad" stroke="none"/><circle cx="346.6" cy="200" r="3" fill="#6a4fb3" stroke="none"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="395.9" y="121" font-size="10.5" fill="#2479ad">30°</text><line x1="260" y1="350" x2="366.07" y2="93.93" stroke="#2479ad" stroke-width="1" opacity="0.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="366.07" cy="93.93" r="3" fill="#2479ad" stroke="none"/><circle cx="322.13" cy="200" r="3" fill="#6a4fb3" stroke="none"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="372.07" y="89.93" font-size="10.5" fill="#2479ad">45°</text><line x1="260" y1="350" x2="335" y2="70.1" stroke="#2479ad" stroke-width="1" opacity="0.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="335" cy="70.1" r="3" fill="#2479ad" stroke="none"/><circle cx="300.19" cy="200" r="3" fill="#6a4fb3" stroke="none"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="341" y="66.1" font-size="10.5" fill="#2479ad">60°</text><line x1="260" y1="350" x2="298.82" y2="55.11" stroke="#2479ad" stroke-width="1" opacity="0.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="298.82" cy="55.11" r="3" fill="#2479ad" stroke="none"/><circle cx="279.75" cy="200" r="3" fill="#6a4fb3" stroke="none"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="304.82" y="51.11" font-size="10.5" fill="#2479ad">75°</text><circle cx="260" cy="50" r="3" fill="#26333e" stroke="none"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="266" y="44" font-size="10.5" fill="#26333e">Zenith → center</text><text x="30" y="30" font-size="12" fill="#26333e">Section: points on the sky dome are projected toward the nadir.</text></g><g id="stc-plan"><circle cx="640" cy="200" r="135" fill="none" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640" cy="200" r="113.28" fill="none" stroke="#a6bdce" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640" cy="200" r="94.53" fill="none" stroke="#a6bdce" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640" cy="200" r="77.94" fill="none" stroke="#a6bdce" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640" cy="200" r="62.95" fill="none" stroke="#a6bdce" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640" cy="200" r="49.14" fill="none" stroke="#a6bdce" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640" cy="200" r="36.17" fill="none" stroke="#a6bdce" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640" cy="200" r="23.8" fill="none" stroke="#a6bdce" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640" cy="200" r="11.81" fill="none" stroke="#a6bdce" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="745.59" y="196" font-size="10.5" fill="#6a4fb3">15°</text><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="719.94" y="196" font-size="10.5" fill="#6a4fb3">30°</text><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="697.92" y="196" font-size="10.5" fill="#6a4fb3">45°</text><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="678.17" y="196" font-size="10.5" fill="#6a4fb3">60°</text><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="659.77" y="196" font-size="10.5" fill="#6a4fb3">75°</text><text x="640" y="375" font-size="14" fill="#6a4fb3" text-anchor="middle" font-weight="700">r = R · tan(ZEN / 2) = R · tan((90° − ALT) / 2)</text><text x="520" y="30" font-size="12" fill="#26333e">Plan: altitude rings are not equally spaced.</text></g></g></svg>
