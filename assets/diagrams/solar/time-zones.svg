<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-label="Longitude correction for Ithaca: 1.5° from the 75° W standard meridian"><title>Longitude correction for Ithaca: 1.5° from the 75° W standard meridian</title><defs><marker id="tz-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#26333e" stroke-width="1.5"/></marker><marker id="tz-arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#2479ad" stroke-width="1.5"/></marker><marker id="tz-arrow-azi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#007c9a" stroke-width="1.5"/></marker><marker id="tz-arrow-third" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#6a4fb3" stroke-width="1.5"/></marker><marker id="tz-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#607181" stroke-width="1.5"/></marker><marker id="tz-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#b13d4c" stroke-width="1.5"/></marker><pattern id="tz-hatch-shadow" patternUnits="userSpaceOnUse" width="3.4" height="3.4" patternTransform="rotate(45)"><rect width="3.4" height="3.4" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="3.4" stroke="#26333e" stroke-width="0.6"/></pattern><pattern id="tz-hatch-shade" patternUnits="userSpaceOnUse" width="7.5" height="7.5" patternTransform="rotate(45)"><rect width="7.5" height="7.5" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7.5" stroke="#26333e" stroke-width="0.6"/></pattern><pattern id="tz-hatch-screen" patternUnits="userSpaceOnUse" width="4.2" height="4.2" patternTransform="rotate(135)"><line x1="0" y1="0" x2="0" y2="4.2" stroke="#26333e" stroke-width="0.6"/></pattern></defs><rect id="tz-background" width="900" height="320" fill="#ffffff"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><g id="tz-zones"><rect x="362.25" y="70" width="195" height="160" fill="#88dcf4" fill-opacity="0.35"/><rect x="60" y="70" width="107.25" height="160" fill="none" stroke="#a6bdce" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="69.75" y1="70" x2="69.75" y2="230" stroke="#26333e" stroke-width="1.5" stroke-dasharray="6 4" stroke-linecap="round" stroke-linejoin="round"/><rect x="167.25" y="70" width="195" height="160" fill="none" stroke="#a6bdce" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="264.75" y1="70" x2="264.75" y2="230" stroke="#26333e" stroke-width="1.5" stroke-dasharray="6 4" stroke-linecap="round" stroke-linejoin="round"/><text x="264.75" y="58" font-size="10.5" fill="#26333e" text-anchor="middle" font-weight="400">UTC−6 · 90° W</text><rect x="362.25" y="70" width="195" height="160" fill="none" stroke="#a6bdce" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="459.75" y1="70" x2="459.75" y2="230" stroke="#26333e" stroke-width="1.5" stroke-dasharray="6 4" stroke-linecap="round" stroke-linejoin="round"/><text x="459.75" y="58" font-size="10.5" fill="#2479ad" text-anchor="middle" font-weight="700">UTC−5 · 75° W</text><rect x="557.25" y="70" width="195" height="160" fill="none" stroke="#a6bdce" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="654.75" y1="70" x2="654.75" y2="230" stroke="#26333e" stroke-width="1.5" stroke-dasharray="6 4" stroke-linecap="round" stroke-linejoin="round"/><text x="654.75" y="58" font-size="10.5" fill="#26333e" text-anchor="middle" font-weight="400">UTC−4 · 60° W</text><rect x="752.25" y="70" width="87.75" height="160" fill="none" stroke="#a6bdce" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="69.75" y1="230" x2="69.75" y2="236" stroke="#a6bdce" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="69.75" y="250" font-size="10.5" fill="#607181" text-anchor="middle">105° W</text><line x1="134.75" y1="230" x2="134.75" y2="236" stroke="#a6bdce" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="134.75" y="250" font-size="10.5" fill="#607181" text-anchor="middle">100° W</text><line x1="199.75" y1="230" x2="199.75" y2="236" stroke="#a6bdce" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="199.75" y="250" font-size="10.5" fill="#607181" text-anchor="middle">95° W</text><line x1="264.75" y1="230" x2="264.75" y2="236" stroke="#a6bdce" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="264.75" y="250" font-size="10.5" fill="#607181" text-anchor="middle">90° W</text><line x1="329.75" y1="230" x2="329.75" y2="236" stroke="#a6bdce" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="329.75" y="250" font-size="10.5" fill="#607181" text-anchor="middle">85° W</text><line x1="394.75" y1="230" x2="394.75" y2="236" stroke="#a6bdce" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="394.75" y="250" font-size="10.5" fill="#607181" text-anchor="middle">80° W</text><line x1="459.75" y1="230" x2="459.75" y2="236" stroke="#a6bdce" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="459.75" y="250" font-size="10.5" fill="#607181" text-anchor="middle">75° W</text><line x1="524.75" y1="230" x2="524.75" y2="236" stroke="#a6bdce" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="524.75" y="250" font-size="10.5" fill="#607181" text-anchor="middle">70° W</text><line x1="589.75" y1="230" x2="589.75" y2="236" stroke="#a6bdce" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="589.75" y="250" font-size="10.5" fill="#607181" text-anchor="middle">65° W</text><line x1="654.75" y1="230" x2="654.75" y2="236" stroke="#a6bdce" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="654.75" y="250" font-size="10.5" fill="#607181" text-anchor="middle">60° W</text><line x1="719.75" y1="230" x2="719.75" y2="236" stroke="#a6bdce" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="719.75" y="250" font-size="10.5" fill="#607181" text-anchor="middle">55° W</text><line x1="784.75" y1="230" x2="784.75" y2="236" stroke="#a6bdce" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="784.75" y="250" font-size="10.5" fill="#607181" text-anchor="middle">50° W</text><line x1="440.25" y1="90" x2="440.25" y2="230" stroke="#b13d4c" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="434.25" y="106" font-size="12" fill="#b13d4c" text-anchor="end" font-weight="600">Ithaca 76.5° W</text><line x1="440.25" y1="180" x2="459.75" y2="180" stroke="#2479ad" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tz-arrow-alt)"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="450" y="200" font-size="12" fill="#2479ad" text-anchor="middle" font-weight="700">1.5° × 4 min/° = 6 min</text><text x="60" y="285" font-size="12" fill="#607181">The sun crosses 75° W first. Ithaca solar time is 6 min behind UTC−5 (before EOT).</text><text x="60" y="305" font-size="12" fill="#26333e" font-weight="600">360° in 24 h → 15° per hour → 4 minutes per degree of longitude.</text></g></g></svg>
