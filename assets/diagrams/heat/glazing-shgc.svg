 patternTransform="rotate(45)"><rect width="7.5" height="7.5" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7.5" stroke="#26333e" stroke-width="0.6"/></pattern><pattern id="gl-hatch-screen" patternUnits="userSpaceOnUse" width="4.2" height="4.2" patternTransform="rotate(135)"><line x1="0" y1="0" x2="0" y2="4.2" stroke="#26333e" stroke-width="0.6"/></pattern></defs><rect id="gl-background" width="800" height="456" fill="#ffffff"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><g id="gl-panes"><rect x="330" y="60" width="10" height="270" fill="url(#gl-hatch-screen)" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="330" y="60" width="10" height="270" fill="none" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="410" y="60" width="10" height="270" fill="url(#gl-hatch-screen)" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="410" y="60" width="10" height="270" fill="none" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><line x1="340.5" y1="60" x2="340.5" y2="330" stroke="#6a4fb3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="344" y="52" font-size="10.5" fill="#6a4fb3" text-anchor="middle" font-weight="700">low-e on #3</text><text x="328" y="348" font-size="10.5" fill="#26333e" text-anchor="end" font-weight="700">#4</text><text x="350" y="348" font-size="10.5" fill="#26333e" text-anchor="start" font-weight="700">#3</text><text x="400" y="348" font-size="10.5" fill="#26333e" text-anchor="start" font-weight="700">#2</text><text x="424" y="348" font-size="10.5" fill="#26333e" text-anchor="start" font-weight="700">#1</text><text x="270" y="370" font-size="10.5" fill="#26333e" text-anchor="middle" font-weight="700" letter-spacing="1.2">INSIDE</text><text x="490" y="370" font-size="10.5" fill="#26333e" text-anchor="middle" font-weight="700" letter-spacing="1.2">OUTSIDE</text><text x="375" y="370" font-size="10.5" fill="#607181" text-anchor="middle">gas fill</text></g><g id="gl-loss"><line x1="210" y1="110" x2="540" y2="110" stroke="#1f6fa3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gl-arrow-alt)"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="212" y="98" font-size="10.5" fill="#1f6fa3" font-weight="600">U_g · (θi − θe)  heat loss</text></g><g id="gl-solar"><circle cx="700" cy="70" r="13" fill="#ffffff" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M715.5,70 L719,70 M710.96,80.96 L713.44,83.44 M700,85.5 L700,89 M689.04,80.96 L686.56,83.44 M684.5,70 L681,70 M689.04,59.04 L686.56,56.56 M700,54.5 L700,51 M710.96,59.04 L713.44,56.56" fill="none" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><line x1="684" y1="80" x2="420" y2="150" stroke="#2479ad" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gl-arrow-alt)"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="600" y="96" font-size="12" fill="#2479ad" font-weight="700">G  incident (100 %)</text><line x1="420" y1="150" x2="620" y2="220" stroke="#607181" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gl-arrow-muted)"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="630" y="232" font-size="10.5" fill="#607181">ρ·G  reflected</text><line x1="420" y1="150" x2="90" y2="300" stroke="#2479ad" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gl-arrow-alt)"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="100" y="318" font-size="10.5" fill="#2479ad" font-weight="600">τ·G  transmitted (short-wave)</text><path d="M326.00,200.00 L323.85,198.59 L321.70,198.00 L319.55,198.59 L317.40,200.00 L315.25,201.41 L313.10,202.00 L310.95,201.41 L308.80,200.00 L306.65,198.59 L304.50,198.00 L302.35,198.59 L300.20,200.00 L298.05,201.41 L295.90,202.00 L293.75,201.41 L291.60,200.00 L289.45,198.59 L287.30,198.00 L285.15,198.59 L283.00,200.00 L280.85,201.41 L278.70,202.00 L276.55,201.41 L274.40,200.00 L272.25,198.59 L270.10,198.00 L267.95,198.59 L265.80,200.00 L263.65,201.41 L261.50,202.00 L259.35,201.41 L257.20,200.00 L255.05,198.59 L252.90,198.00 L250.75,198.82 L248.60,200.00 L246.45,200.71 L244.30,200.67 L242.15,200.24 L240.00,200.00" fill="none" stroke="#6a4fb3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gl-arrow-third)"/><path d="M424.00,270.00 L426.15,271.41 L428.30,272.00 L430.45,271.41 L432.60,270.00 L434.75,268.59 L436.90,268.00 L439.05,268.59 L441.20,270.00 L443.35,271.41 L445.50,272.00 L447.65,271.41 L449.80,270.00 L451.95,268.59 L454.10,268.00 L456.25,268.59 L458.40,270.00 L460.55,271.41 L462.70,272.00 L464.85,271.41 L467.00,270.00 L469.15,268.59 L471.30,268.00 L473.45,268.59 L475.60,270.00 L477.75,271.41 L479.90,272.00 L482.05,271.41 L484.20,270.00 L486.35,268.59 L488.50,268.00 L490.65,268.59 L492.80,270.00 L494.95,271.41 L497.10,272.00 L499.25,271.18 L501.40,270.00 L503.55,269.29 L505.70,269.33 L507.85,269.76 L510.00,270.00" fill="none" stroke="#6a4fb3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gl-arrow-third)"/><text x="70" y="168" font-size="10.5" fill="#6a4fb3">q_i  absorbed, then released</text><text x="70" y="182" font-size="10.5" fill="#6a4fb3">inward by convection and</text><text x="70" y="196" font-size="10.5" fill="#6a4fb3">long-wave radiation</text><text x="516" y="266" font-size="10.5" fill="#6a4fb3">q_e  released outward</text></g><g id="gl-definitions"><text x="40" y="398" font-size="10.5" fill="#26333e">SHGC (US, NFRC) ≈ g-value (EN 410, Gesamtenergiedurchlassgrad) = (τ·G + q_i) / G.</text><text x="40" y="414" font-size="10.5" fill="#26333e">Low-e on #2: low SHGC for cooling-dominated buildings. Low-e on #3: high SHGC for passive solar heating.</text><text x="40" y="430" font-size="10.5" fill="#26333e">U_g covers conduction, convection and long-wave radiation across the gap: the coating cuts the radiation, argon the conduction.</text></g></g></svg>
