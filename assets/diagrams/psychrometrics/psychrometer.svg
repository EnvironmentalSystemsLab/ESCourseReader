<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 410" role="img" aria-label="Sling psychrometer: dry-bulb and wet-bulb thermometers"><title>Sling psychrometer: dry-bulb and wet-bulb thermometers</title><defs><marker id="psy-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#26333e" stroke-width="1.5"/></marker><marker id="psy-arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#2479ad" stroke-width="1.5"/></marker><marker id="psy-arrow-azi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#007c9a" stroke-width="1.5"/></marker><marker id="psy-arrow-third" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#6a4fb3" stroke-width="1.5"/></marker><marker id="psy-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#607181" stroke-width="1.5"/></marker><marker id="psy-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#b13d4c" stroke-width="1.5"/></marker><pattern id="psy-hatch-shadow" patternUnits="userSpaceOnUse" width="3.4" height="3.4" patternTransform="rotate(45)"><rect width="3.4" height="3.4" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="3.4" stroke="#26333e" stroke-width="0.6"/></pattern><pattern id="psy-hatch-shade" patternUnits="userSpaceOnUse" width="7.5" height="7.5" patternTransform="rotate(45)"><rect width="7.5" height="7.5" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7.5" stroke="#26333e" stroke-width="0.6"/></pattern><pattern id="psy-hatch-screen" patternUnits="userSpaceOnUse" width="4.2" height="4.2" patternTransform="rotate(135)"><line x1="0" y1="0" x2="0" y2="4.2" stroke="#26333e" stroke-width="0.6"/></pattern></defs><rect id="psy-background" width="780" height="410" fill="#ffffff"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect x="131" y="60" width="18" height="230" rx="9" fill="#ffffff" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M148.05,270 Q154.9,270 161.75,270" fill="none" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="164" y="274" font-size="10.5" fill="#607181">-10</text><path d="M146.93,251 Q151.48,251 156.04,251" fill="none" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M146.85,232 Q154.04,232.01 161.23,232" fill="none" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="164" y="236" font-size="10.5" fill="#607181">0</text><path d="M148.08,213 Q152.63,212.99 157.17,213" fill="none" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M148.06,194 Q155.05,193.97 162.04,194" fill="none" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="164" y="198" font-size="10.5" fill="#607181">10</text><path d="M146.94,175 Q151.86,175 156.77,175" fill="none" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M147.44,156 Q154.19,156.02 160.93,156" fill="none" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="164" y="160" font-size="10.5" fill="#607181">20</text><path d="M147.69,137 Q152.09,136.97 156.49,137" fill="none" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M146.9,118 Q154.47,118.02 162.04,118" fill="none" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="164" y="122" font-size="10.5" fill="#607181">30</text><path d="M147.77,99 Q152.28,99.01 156.79,99" fill="none" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M147.21,80 Q154.29,80.01 161.37,80" fill="none" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="164" y="84" font-size="10.5" fill="#607181">40</text><rect x="137.5" y="156" width="5" height="130" fill="#2479ad" stroke="none"/><circle cx="140" cy="296" r="13" fill="#2479ad" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="46" font-size="12" fill="#26333e" text-anchor="middle" font-weight="700">DRY BULB</text><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="124" y="160" font-size="10.5" fill="#2479ad" text-anchor="end" font-weight="700">20.0 °C</text><rect x="271" y="60" width="18" height="230" rx="9" fill="#ffffff" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M287.3,270 Q294.63,270.02 301.95,270" fill="none" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="304" y="274" font-size="10.5" fill="#607181">-10</text><path d="M287.51,251 Q291.81,251 296.11,251" fill="none" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M287.62,232 Q294.5,232.01 301.38,232" fill="none" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="304" y="236" font-size="10.5" fill="#607181">0</text><path d="M286.7,213 Q291.48,213.03 296.25,213" fill="none" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M287.53,194 Q294.47,193.97 301.41,194" fill="none" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="304" y="198" font-size="10.5" fill="#607181">10</text><path d="M287.99,175 Q292.24,174.99 296.5,175" fill="none" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M287.06,156 Q294.17,156.04 301.27,156" fill="none" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="304" y="160" font-size="10.5" fill="#607181">20</text><path d="M287.62,137 Q292.42,136.99 297.22,137" fill="none" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M287.01,118 Q294.44,117.99 301.87,118" fill="none" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="304" y="122" font-size="10.5" fill="#607181">30</text><path d="M286.8,99 Q291.64,99.01 296.47,99" fill="none" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M287.18,80 Q294.43,79.98 301.68,80" fill="none" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="304" y="84" font-size="10.5" fill="#607181">40</text><rect x="277.5" y="186.4" width="5" height="99.6" fill="#2479ad" stroke="none"/><circle cx="280" cy="296" r="13" fill="#2479ad" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="265" y="280" width="30" height="34" rx="6" fill="#a3dde2" fill-opacity="0.5" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M280,314 C276,330 284,344 280,356" fill="none" stroke="#26333e" stroke-width="1" stroke-dasharray="2 2" stroke-linecap="round" stroke-linejoin="round"/><text x="220" y="330" font-size="10.5" fill="#26333e">wet wick</text><text x="280" y="46" font-size="12" fill="#26333e" text-anchor="middle" font-weight="700">WET BULB</text><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="264" y="190.4" font-size="10.5" fill="#2479ad" text-anchor="end" font-weight="700">12.0 °C</text><rect x="230" y="356" width="110" height="32" rx="8" fill="#a3dde2" fill-opacity="0.4" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="285" y="377" font-size="10.5" fill="#607181" text-anchor="middle">water</text><line x1="190" y1="330" x2="190" y2="230" stroke="#007c9a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#psy-arrow-azi)"/><line x1="210" y1="330" x2="210" y2="230" stroke="#007c9a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#psy-arrow-azi)"/><text x="200" y="350" font-size="10.5" fill="#007c9a" text-anchor="middle" font-weight="700">air flow</text><text x="400" y="90" font-size="12" fill="#26333e">Evaporation from the wick cools the wet bulb.</text><text x="400" y="107" font-size="12" fill="#26333e">Dry air: strong evaporation, large depression.</text><text x="400" y="124" font-size="12" fill="#26333e">Saturated air: no evaporation, WBT = DBT.</text><text x="400" y="141" font-size="12" fill="#26333e"></text><text x="400" y="158" font-size="12" fill="#26333e">DBT 20.0 °C, WBT 12.0 °C</text><text x="400" y="175" font-size="12" fill="#26333e">wet-bulb depression 8.0 K</text><text x="400" y="192" font-size="12" fill="#26333e">→ RH 38 %, AH 5.4 g/kg (lecture: 38 %)</text><text x="400" y="209" font-size="12" fill="#26333e"></text><text x="400" y="226" font-size="12" fill="#26333e">Whirl the sling psychrometer (or run the fan of an</text><text x="400" y="243" font-size="12" fill="#26333e">aspirated one) for ≥ 2–3 m/s past the wick, then read</text><text x="400" y="260" font-size="12" fill="#26333e">the wet bulb first. Plot both on the chart: the</text><text x="400" y="277" font-size="12" fill="#26333e">intersection is the status point.</text></g></svg>
