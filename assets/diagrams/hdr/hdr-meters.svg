<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 515" role="img" aria-label="An illuminance meter reads lux on a plane; a spot luminance meter reads cd/m² from a patch"><title>An illuminance meter reads lux on a plane; a spot luminance meter reads cd/m² from a patch</title><defs><marker id="hm-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#26333e" stroke-width="1.5"/></marker><marker id="hm-arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#2479ad" stroke-width="1.5"/></marker><marker id="hm-arrow-azi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#007c9a" stroke-width="1.5"/></marker><marker id="hm-arrow-third" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#6a4fb3" stroke-width="1.5"/></marker><marker id="hm-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#607181" stroke-width="1.5"/></marker><marker id="hm-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#b13d4c" stroke-width="1.5"/></marker><pattern id="hm-hatch-shadow" patternUnits="userSpaceOnUse" width="3.4" height="3.4" patternTransform="rotate(45)"><rect width="3.4" height="3.4" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="3.4" stroke="#26333e" stroke-width="0.6"/></pattern><pattern id="hm-hatch-shade" patternUnits="userSpaceOnUse" width="7.5" height="7.5" patternTransform="rotate(45)"><rect width="7.5" height="7.5" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7.5" stroke="#26333e" stroke-width="0.6"/></pattern><pattern id="hm-hatch-screen" patternUnits="userSpaceOnUse" width="4.2" height="4.2" patternTransform="rotate(135)"><line x1="0" y1="0" x2="0" y2="4.2" stroke="#26333e" stroke-width="0.6"/></pattern></defs><rect id="hm-background" width="990" height="515" fill="#ffffff"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><g id="hm-illuminance-meter"><text x="40" y="36" font-size="10.5" fill="#26333e" font-weight="700" letter-spacing="1.2">A · ILLUMINANCE METER</text><text x="40" y="56" font-size="12" fill="#607181">e.g. Konica Minolta T-10A</text><text x="40" y="96" font-size="34" fill="#007c9a" font-weight="700">lx</text><rect x="208" y="150" width="84" height="170" rx="10" fill="#ffffff" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="250" cy="136" r="38" fill="url(#hm-hatch-shade)" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="250" cy="136" r="24" fill="#ffffff" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="218" y="180" width="64" height="40" fill="#ffffff" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="260" y="207" font-size="16" fill="#26333e" text-anchor="end">500</text><text x="264" y="207" font-size="10.5" fill="#26333e">lx</text><rect x="224" y="232" width="14" height="7" fill="#ffffff" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="244" y="232" width="14" height="7" fill="#ffffff" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="264" y="232" width="14" height="7" fill="#ffffff" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="218" y="252" width="64" height="22" fill="url(#hm-hatch-shadow)" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M148.03,119.7 Q188.5,125.68 228.89,132.14" fill="none" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="112" font-size="12" fill="#26333e">white diffuser</text><text x="60" y="127" font-size="12" fill="#26333e">collects light</text><path d="M148.31,200 Q183.01,199.76 217.71,200" fill="none" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="204" font-size="12" fill="#26333e">reads lux</text><text x="308" y="170" font-size="12" fill="#26333e">no viewfinder</text><text x="40" y="360" font-size="12" fill="#007c9a" font-weight="700" letter-spacing="1">LIGHT ARRIVING AT A PLANE</text><text x="40" y="380" font-size="12" fill="#26333e">How much light reaches this position?</text><text x="40" y="398" font-size="12" fill="#26333e">PLACE the sensor on the measurement plane:</text><text x="40" y="416" font-size="12" fill="#26333e">· desk: diffuser faces up</text><text x="40" y="434" font-size="12" fill="#26333e">· eye plane: diffuser faces the view direction</text><text x="40" y="452" font-size="12" fill="#26333e">Use: workplane E or eye illuminance Ev.</text></g><g id="hm-luminance-meter"><text x="520" y="36" font-size="10.5" fill="#26333e" font-weight="700" letter-spacing="1.2">B · SPOT LUMINANCE METER</text><text x="520" y="56" font-size="12" fill="#607181">e.g. Konica Minolta LS-150</text><text x="520" y="96" font-size="34" fill="#2479ad" font-weight="700">cd/m²</text><g transform="translate(640 110)"><path d="M 0 0 H 148 Q 179 0 179 28 V 96 Q 179 122 153 125 L 116 128 L 99 239 H 47 L 59 129 H 7 Q -17 129 -17 105 V 25 Q -17 0 0 0 Z" fill="#ffffff" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-41" y="38" width="25" height="43" fill="url(#hm-hatch-shadow)" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="178" y="15" width="62" height="96" fill="url(#hm-hatch-shade)" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="212" y="15" width="28" height="96" fill="url(#hm-hatch-shadow)" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="42" font-size="16" fill="#26333e" font-weight="700">LS-150</text><path d="M5.64,57 Q79.09,56.5 152.53,57" fill="none" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M57.98,211 Q76.11,211.04 94.25,211" fill="none" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M568.74,223.03 Q587.23,207.78 605.75,192.56" fill="none" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="520" y="238" font-size="12" fill="#26333e">viewfinder: look here</text><path d="M850,106.93 Q850.01,115.89 850,124.86" fill="none" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="850" y="100" font-size="12" fill="#26333e" text-anchor="middle">lens: aim at a patch</text><line x1="880" y1="170" x2="960" y2="160" stroke="#2479ad" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><line x1="880" y1="170" x2="960" y2="180" stroke="#2479ad" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="958" y="205" font-size="10.5" fill="#2479ad" text-anchor="end" font-weight="600">1° spot</text><rect x="800" y="270" width="120" height="46" fill="#ffffff" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="866" y="300" font-size="16" fill="#26333e" text-anchor="end">150</text><text x="870" y="300" font-size="10.5" fill="#26333e">cd/m²</text><text x="800" y="332" font-size="10.5" fill="#607181">rear display (example)</text><text x="520" y="360" font-size="12" fill="#2479ad" font-weight="700" letter-spacing="1">LIGHT FROM A SELECTED PATCH</text><text x="520" y="380" font-size="12" fill="#26333e">How bright is that surface from here?</text><text x="520" y="398" font-size="12" fill="#26333e">AIM the lens through the viewfinder:</text><text x="520" y="416" font-size="12" fill="#26333e">· keep the central circle on one patch</text><text x="520" y="434" font-size="12" fill="#26333e">· the spot is 1°, not the whole viewfinder</text><text x="520" y="452" font-size="12" fill="#26333e">Use: spot readings for HDR calibration.</text></g><g id="hm-divider"><line x1="490" y1="24" x2="490" y2="470" stroke="#a6bdce" stroke-width="0.6" stroke-dasharray="3 4" stroke-linecap="round" stroke-linejoin="round"/></g><g id="hm-note"><text x="40" y="500" font-size="12" fill="#607181">Only cd/m² spot readings belong in an HDR calibration. Simplified drawings; the display values are examples, not a lux-to-cd/m² conversion.</text></g></g></svg>
