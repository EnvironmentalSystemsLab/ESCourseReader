<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-label="Camera setup for a lighting study, in plan and section"><title>Camera setup for a lighting study, in plan and section</title><defs><marker id="hcs-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#26333e" stroke-width="1.5"/></marker><marker id="hcs-arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#2479ad" stroke-width="1.5"/></marker><marker id="hcs-arrow-azi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#007c9a" stroke-width="1.5"/></marker><marker id="hcs-arrow-third" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#6a4fb3" stroke-width="1.5"/></marker><marker id="hcs-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#607181" stroke-width="1.5"/></marker><marker id="hcs-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#b13d4c" stroke-width="1.5"/></marker><pattern id="hcs-hatch-shadow" patternUnits="userSpaceOnUse" width="3.4" height="3.4" patternTransform="rotate(45)"><rect width="3.4" height="3.4" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="3.4" stroke="#26333e" stroke-width="0.6"/></pattern><pattern id="hcs-hatch-shade" patternUnits="userSpaceOnUse" width="7.5" height="7.5" patternTransform="rotate(45)"><rect width="7.5" height="7.5" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7.5" stroke="#26333e" stroke-width="0.6"/></pattern><pattern id="hcs-hatch-screen" patternUnits="userSpaceOnUse" width="4.2" height="4.2" patternTransform="rotate(135)"><line x1="0" y1="0" x2="0" y2="4.2" stroke="#26333e" stroke-width="0.6"/></pattern></defs><rect id="hcs-background" width="1000" height="510" fill="#ffffff"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><g id="hcs-plan"><text x="40" y="36" font-size="10.5" fill="#26333e" font-weight="700" letter-spacing="1.2">A · PLAN: THE VIEW IN FRONT OF THE OBSERVER</text><rect x="60" y="70" width="400" height="14" fill="url(#hcs-hatch-shadow)" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="160" y="70" width="200" height="14" fill="url(#hcs-hatch-screen)" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="84" width="14" height="330" fill="url(#hcs-hatch-shadow)" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="446" y="84" width="14" height="330" fill="url(#hcs-hatch-shadow)" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="414" width="400" height="14" fill="url(#hcs-hatch-shadow)" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M90,330 A170,170 0 0 1 430,330 Z" fill="url(#hcs-hatch-screen)" stroke="none"/><path d="M90,330 A170,170 0 0 1 430,330" fill="none" stroke="#26333e" stroke-width="1" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round"/><line x1="90" y1="330" x2="430" y2="330" stroke="#a6bdce" stroke-width="0.6" stroke-dasharray="4 4" stroke-linecap="round" stroke-linejoin="round"/><rect x="242" y="324" width="36" height="26" fill="#ffffff" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="260" cy="324" r="10" fill="#ffffff" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="260" y1="308" x2="260" y2="190" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hcs-arrow-ink)"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="268" y="214" font-size="12" fill="#26333e">view direction</text><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="260" y="372" font-size="12" fill="#26333e" text-anchor="middle">Lens at the observer position</text><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="260" y="388" font-size="10.5" fill="#607181" text-anchor="middle">180° in plan; the full forward hemisphere in 3D</text><circle cx="120" cy="240" r="13" fill="#ffffff" stroke="#2479ad" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="120" y="274" font-size="10.5" fill="#2479ad" text-anchor="middle">matte target</text><text x="260" y="104" font-size="10.5" fill="#26333e" text-anchor="middle" font-weight="700" letter-spacing="1.2">WINDOW</text></g><g id="hcs-section"><text x="540" y="36" font-size="10.5" fill="#26333e" font-weight="700" letter-spacing="1.2">B · SECTION: THE LENS AT EYE HEIGHT</text><rect x="540" y="414" width="420" height="14" fill="url(#hcs-hatch-shadow)" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="540" y="70" width="420" height="14" fill="url(#hcs-hatch-shadow)" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="946" y="84" width="14" height="110" fill="url(#hcs-hatch-shadow)" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="946" y="300" width="14" height="114" fill="url(#hcs-hatch-shadow)" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="950" y="194" width="6" height="106" fill="url(#hcs-hatch-screen)" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="678" y="281" width="34" height="26" fill="#ffffff" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="712" y="285" width="9" height="18" fill="url(#hcs-hatch-shadow)" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M695.48,306.5 Q678.17,361.12 660.48,415.62" fill="none" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M695,305.95 Q695.19,360.86 695,415.77" fill="none" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M694.43,306.23 Q712.17,360.88 729.53,415.65" fill="none" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><line x1="721" y1="294" x2="930" y2="294" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hcs-arrow-ink)"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="800" y="284" font-size="12" fill="#26333e">level axis</text><rect x="722" y="312" width="6" height="22" fill="#ffffff" stroke="#007c9a" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/><line x1="725" y1="334" x2="712" y2="348" stroke="#007c9a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="740" y="328" font-size="10.5" fill="#007c9a">Lux sensor: same position,</text><text x="740" y="343" font-size="10.5" fill="#007c9a">vertical, facing the view</text><line x1="600" y1="414" x2="600" y2="294" stroke="#2479ad" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hcs-arrow-alt)"/><line x1="592" y1="294" x2="608" y2="294" stroke="#2479ad" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="608" y="358" font-size="12" fill="#2479ad" font-weight="600">eye height</text><text x="556" y="120" font-size="12" fill="#607181">Use the real eye height:</text><text x="556" y="136" font-size="12" fill="#607181">about 1.2 m seated, 1.6 m standing.</text><text x="556" y="152" font-size="12" fill="#607181">Record it with the capture.</text></g><g id="hcs-note"><text x="40" y="468" font-size="12" fill="#607181">Keep the operator behind the lens during capture. Record location, date, time, view direction and sky conditions.</text><text x="40" y="486" font-size="12" fill="#607181">In a scale model, place the lens at the equivalent eye position and keep the camera opening from blocking daylight.</text></g></g></svg>
