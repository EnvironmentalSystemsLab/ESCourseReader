<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-label="Reflectance of a matte sample from luminance and illuminance, or against a gray card"><title>Reflectance of a matte sample from luminance and illuminance, or against a gray card</title><defs><marker id="ur-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#26333e" stroke-width="1.5"/></marker><marker id="ur-arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#2479ad" stroke-width="1.5"/></marker><marker id="ur-arrow-azi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#007c9a" stroke-width="1.5"/></marker><marker id="ur-arrow-third" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#6a4fb3" stroke-width="1.5"/></marker><marker id="ur-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#607181" stroke-width="1.5"/></marker><marker id="ur-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#b13d4c" stroke-width="1.5"/></marker><pattern id="ur-hatch-shadow" patternUnits="userSpaceOnUse" width="3.4" height="3.4" patternTransform="rotate(45)"><rect width="3.4" height="3.4" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="3.4" stroke="#26333e" stroke-width="0.6"/></pattern><pattern id="ur-hatch-shade" patternUnits="userSpaceOnUse" width="7.5" height="7.5" patternTransform="rotate(45)"><rect width="7.5" height="7.5" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7.5" stroke="#26333e" stroke-width="0.6"/></pattern><pattern id="ur-hatch-screen" patternUnits="userSpaceOnUse" width="4.2" height="4.2" patternTransform="rotate(135)"><line x1="0" y1="0" x2="0" y2="4.2" stroke="#26333e" stroke-width="0.6"/></pattern></defs><rect id="ur-background" width="980" height="420" fill="#ffffff"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><g id="ur-lux"><text x="40" y="36" font-size="10.5" fill="#26333e" font-weight="700" letter-spacing="1.2">A · REFLECTANCE FROM L AND E</text><rect x="420" y="60" width="14" height="300" fill="url(#ur-hatch-shadow)" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="400" y="150" width="20" height="90" fill="#ffffff" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="146" font-size="12" fill="#26333e" text-anchor="end">matte sample</text><path d="M302.6,142.78 Q351.31,150.89 400.13,158.34" fill="none" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="398" y1="195" x2="374.06" y2="129.22" stroke="#2479ad" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ur-arrow-alt)"/><line x1="398" y1="195" x2="340.66" y2="154.85" stroke="#2479ad" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ur-arrow-alt)"/><line x1="398" y1="195" x2="328" y2="195" stroke="#2479ad" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ur-arrow-alt)"/><line x1="398" y1="195" x2="340.66" y2="235.15" stroke="#2479ad" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ur-arrow-alt)"/><line x1="398" y1="195" x2="374.06" y2="260.78" stroke="#2479ad" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ur-arrow-alt)"/><path d="M398,125 A70,70 0 0 0 398,265" fill="none" stroke="#2479ad" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round" stroke-linejoin="round"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="300" y="116" font-size="10.5" fill="#2479ad" text-anchor="end">diffuse: same L in all directions</text><rect x="408" y="262" width="12" height="34" fill="#ffffff" stroke="#007c9a" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/><text x="398" y="330" font-size="12" fill="#007c9a" text-anchor="end" font-weight="600">lux sensor on the wall, facing out: E</text><line x1="250" y1="200" x2="404" y2="233" stroke="#007c9a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ur-arrow-azi)"/><line x1="250" y1="230" x2="404" y2="272" stroke="#007c9a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ur-arrow-azi)"/><line x1="250" y1="260" x2="404" y2="311" stroke="#007c9a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ur-arrow-azi)"/><rect x="60" y="180" width="40" height="28" fill="#ffffff" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="100" y="186" width="10" height="16" fill="url(#ur-hatch-shadow)" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M80,205.91 Q79.46,283.74 80,361.56" fill="none" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><line x1="330" y1="195" x2="116" y2="194" stroke="#2479ad" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ur-arrow-alt)"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="200" y="182" font-size="12" fill="#2479ad" text-anchor="middle" font-weight="600">L from the HDR</text><text x="40" y="400" font-size="14" fill="#26333e" font-weight="700">ρ = π L / E  ·  e.g. π × 40 cd/m² / 250 lx = 0.50</text></g><g id="ur-gray-card"><text x="520" y="36" font-size="10.5" fill="#26333e" font-weight="700" letter-spacing="1.2">B · REFLECTANCE AGAINST A GRAY CARD IN THE FRAME</text><rect x="540" y="80" width="400" height="230" fill="#ffffff" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="600" y="140" width="110" height="110" fill="url(#ur-hatch-shade)" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="770" y="140" width="110" height="110" fill="#ffffff" stroke="#2479ad" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/><text x="655" y="270" font-size="12" fill="#26333e" text-anchor="middle">gray card ρ = 0.18</text><text x="655" y="287" font-size="12" fill="#2479ad" text-anchor="middle" font-weight="600">L = 14 cd/m²</text><text x="825" y="270" font-size="12" fill="#26333e" text-anchor="middle">sample</text><text x="825" y="287" font-size="12" fill="#2479ad" text-anchor="middle" font-weight="600">L = 49 cd/m²</text><text x="520" y="340" font-size="14" fill="#26333e" font-weight="700">ρx = ρcard · Lx / Lcard = 0.18 × 49 / 14 = 0.63</text><text x="520" y="366" font-size="12" fill="#26333e">Same plane, same light, both matte, view not grazing.</text><text x="520" y="384" font-size="12" fill="#26333e">Glossy or textured finishes: not diffuse, so no single ρ.</text></g></g></svg>
