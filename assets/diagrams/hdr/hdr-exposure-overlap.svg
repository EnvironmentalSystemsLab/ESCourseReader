<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 465" role="img" aria-label="Exposure bracket: overlapping usable ranges merge into one linear HDR"><title>Exposure bracket: overlapping usable ranges merge into one linear HDR</title><defs><marker id="hex-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#26333e" stroke-width="1.5"/></marker><marker id="hex-arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#2479ad" stroke-width="1.5"/></marker><marker id="hex-arrow-azi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#007c9a" stroke-width="1.5"/></marker><marker id="hex-arrow-third" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#6a4fb3" stroke-width="1.5"/></marker><marker id="hex-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#607181" stroke-width="1.5"/></marker><marker id="hex-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#b13d4c" stroke-width="1.5"/></marker><pattern id="hex-hatch-shadow" patternUnits="userSpaceOnUse" width="3.4" height="3.4" patternTransform="rotate(45)"><rect width="3.4" height="3.4" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="3.4" stroke="#26333e" stroke-width="0.6"/></pattern><pattern id="hex-hatch-shade" patternUnits="userSpaceOnUse" width="7.5" height="7.5" patternTransform="rotate(45)"><rect width="7.5" height="7.5" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7.5" stroke="#26333e" stroke-width="0.6"/></pattern><pattern id="hex-hatch-screen" patternUnits="userSpaceOnUse" width="4.2" height="4.2" patternTransform="rotate(135)"><line x1="0" y1="0" x2="0" y2="4.2" stroke="#26333e" stroke-width="0.6"/></pattern></defs><rect id="hex-background" width="980" height="465" fill="#ffffff"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><g id="hex-axis"><line x1="230" y1="72" x2="940" y2="72" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hex-arrow-ink)"/><text x="230" y="60" font-size="12" fill="#26333e">darker surfaces</text><text x="930" y="60" font-size="12" fill="#26333e" text-anchor="end">brighter sources</text><text x="580" y="60" font-size="10.5" fill="#607181" text-anchor="middle">scene luminance, log scale</text><path d="M230,66.38 Q230,71.77 230,77.16" fill="none" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M300,65.69 Q300.03,71.44 300,77.18" fill="none" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M370,66.74 Q370.01,71.97 370,77.19" fill="none" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M440,66.59 Q440.01,72.29 440,77.98" fill="none" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M510,65.8 Q510,71.36 510,76.92" fill="none" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M580,66.67 Q579.98,72.11 580,77.55" fill="none" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M650,66.06 Q650.03,72.12 650,78.18" fill="none" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M720,66.88 Q720.03,72.01 720,77.13" fill="none" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M790,65.93 Q790.02,71.82 790,77.71" fill="none" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M860,66.05 Q860,71.95 860,77.85" fill="none" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M930,66.52 Q929.98,72.02 930,77.51" fill="none" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><g id="hex-exposures"><text x="40" y="123" font-size="14" fill="#26333e" font-weight="700">Long exposure</text><text x="40" y="139" font-size="10.5" fill="#607181">e.g. 1/30 s</text><rect x="230" y="110" width="290" height="30" fill="#ffffff" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="375" y="130" font-size="12" fill="#26333e" text-anchor="middle">usable signal</text><rect x="520" y="110" width="410" height="30" fill="url(#hex-hatch-shadow)" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="193" font-size="14" fill="#26333e" font-weight="700">Middle exposure</text><text x="40" y="209" font-size="10.5" fill="#607181">e.g. 1/125 s · 2 stops shorter</text><rect x="230" y="180" width="140" height="30" fill="url(#hex-hatch-screen)" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="370" y="180" width="320" height="30" fill="#ffffff" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="530" y="200" font-size="12" fill="#26333e" text-anchor="middle">usable signal</text><rect x="690" y="180" width="240" height="30" fill="url(#hex-hatch-shadow)" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="263" font-size="14" fill="#26333e" font-weight="700">Short exposure</text><text x="40" y="279" font-size="10.5" fill="#607181">e.g. 1/500 s · 2 stops shorter</text><rect x="230" y="250" width="310" height="30" fill="url(#hex-hatch-screen)" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="540" y="250" width="320" height="30" fill="#ffffff" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="700" y="270" font-size="12" fill="#26333e" text-anchor="middle">usable signal</text><rect x="860" y="250" width="70" height="30" fill="url(#hex-hatch-shadow)" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="370" y1="142" x2="370" y2="178" stroke="#6a4fb3" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round" stroke-linejoin="round"/><line x1="520" y1="142" x2="520" y2="178" stroke="#6a4fb3" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round" stroke-linejoin="round"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="445" y="165" font-size="10.5" fill="#6a4fb3" text-anchor="middle" font-weight="600">overlap</text><line x1="540" y1="212" x2="540" y2="248" stroke="#6a4fb3" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round" stroke-linejoin="round"/><line x1="690" y1="212" x2="690" y2="248" stroke="#6a4fb3" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round" stroke-linejoin="round"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="615" y="235" font-size="10.5" fill="#6a4fb3" text-anchor="middle" font-weight="600">overlap</text></g><g id="hex-merge"><text x="40" y="353" font-size="14" fill="#26333e" font-weight="700">Merged HDR</text><text x="40" y="369" font-size="10.5" fill="#607181">one linear image</text><rect x="230" y="340" width="630" height="30" fill="#ffffff" stroke="#26333e" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/><text x="545" y="360" font-size="12" fill="#26333e" text-anchor="middle" font-weight="600">ratios preserved → calibrate to cd/m²</text><rect x="860" y="340" width="70" height="30" fill="url(#hex-hatch-shadow)" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="895" y1="340" x2="895" y2="312" stroke="#b13d4c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="895" y="304" font-size="10.5" fill="#b13d4c" text-anchor="end" font-weight="600">clipped in every frame: unknown</text></g><g id="hex-key"><rect x="40" y="404" width="26" height="14" fill="url(#hex-hatch-screen)" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="74" y="415" font-size="12" fill="#26333e">below the noise floor</text><rect x="250" y="404" width="26" height="14" fill="#ffffff" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="284" y="415" font-size="12" fill="#26333e">usable signal</text><rect x="460" y="404" width="26" height="14" fill="url(#hex-hatch-shadow)" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="494" y="415" font-size="12" fill="#26333e">clipped (saturated)</text><text x="40" y="448" font-size="12" fill="#607181">Conceptual ranges. Each important area needs one frame above noise and below clipping; the frame count follows from coverage.</text></g></g></svg>
