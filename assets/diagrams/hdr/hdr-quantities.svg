<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" role="img" aria-label="Illuminance on a desk and luminance of a wall seen by a camera"><title>Illuminance on a desk and luminance of a wall seen by a camera</title><defs><marker id="hq-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#26333e" stroke-width="1.5"/></marker><marker id="hq-arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#2479ad" stroke-width="1.5"/></marker><marker id="hq-arrow-azi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#007c9a" stroke-width="1.5"/></marker><marker id="hq-arrow-third" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#6a4fb3" stroke-width="1.5"/></marker><marker id="hq-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#607181" stroke-width="1.5"/></marker><marker id="hq-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#b13d4c" stroke-width="1.5"/></marker><pattern id="hq-hatch-shadow" patternUnits="userSpaceOnUse" width="3.4" height="3.4" patternTransform="rotate(45)"><rect width="3.4" height="3.4" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="3.4" stroke="#26333e" stroke-width="0.6"/></pattern><pattern id="hq-hatch-shade" patternUnits="userSpaceOnUse" width="7.5" height="7.5" patternTransform="rotate(45)"><rect width="7.5" height="7.5" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7.5" stroke="#26333e" stroke-width="0.6"/></pattern><pattern id="hq-hatch-screen" patternUnits="userSpaceOnUse" width="4.2" height="4.2" patternTransform="rotate(135)"><line x1="0" y1="0" x2="0" y2="4.2" stroke="#26333e" stroke-width="0.6"/></pattern></defs><rect id="hq-background" width="980" height="440" fill="#ffffff"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><g id="hq-room"><rect x="40" y="76" width="900" height="14" fill="url(#hq-hatch-shadow)" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="380" width="900" height="14" fill="url(#hq-hatch-shadow)" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="90" width="20" height="70" fill="url(#hq-hatch-shadow)" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="300" width="20" height="80" fill="url(#hq-hatch-shadow)" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="46" y="160" width="8" height="140" fill="url(#hq-hatch-screen)" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="920" y="90" width="20" height="290" fill="url(#hq-hatch-shadow)" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="190" y="292" width="260" height="9" fill="#ffffff" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M200,298.75 Q200.27,340.44 200,382.12" fill="none" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M440,297.61 Q440,340.43 440,383.25" fill="none" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="300" y="282" width="34" height="10" fill="#ffffff" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M326,282 A9,9 0 0 0 308,282" fill="none" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><g id="hq-illuminance"><line x1="14" y1="160" x2="300" y2="276" stroke="#007c9a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hq-arrow-azi)"/><line x1="14" y1="196" x2="316" y2="270" stroke="#007c9a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hq-arrow-azi)"/><line x1="14" y1="232" x2="330" y2="276" stroke="#007c9a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hq-arrow-azi)"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="140" y="132" font-size="12" fill="#007c9a" font-weight="700">ILLUMINANCE  E  [lx]</text><text x="140" y="150" font-size="12" fill="#26333e">Light arriving on a plane,</text><text x="140" y="166" font-size="12" fill="#26333e">from every direction above it.</text><text x="210" y="330" font-size="10.5" fill="#607181">Lux sensor on the desk,</text><text x="210" y="345" font-size="10.5" fill="#607181">diffuser facing up.</text></g><g id="hq-luminance"><rect x="618" y="207" width="34" height="26" fill="#ffffff" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="652" y="211" width="9" height="18" fill="url(#hq-hatch-shadow)" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M635.41,232.22 Q618.06,307.16 600.52,382.06" fill="none" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M635,232.84 Q635.09,307.35 635,381.87" fill="none" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M634.5,231.84 Q651.94,306.34 669.21,380.88" fill="none" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="913" y="170" width="7" height="70" fill="#ffffff" stroke="#2479ad" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/><line x1="910" y1="178" x2="669" y2="216.76" stroke="#2479ad" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hq-arrow-alt)"/><line x1="910" y1="205" x2="669" y2="220" stroke="#2479ad" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hq-arrow-alt)"/><line x1="910" y1="232" x2="669" y2="223.24" stroke="#2479ad" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hq-arrow-alt)"/><line x1="661" y1="220" x2="912" y2="112" stroke="#a6bdce" stroke-width="0.6" stroke-dasharray="4 4" stroke-linecap="round" stroke-linejoin="round"/><line x1="661" y1="220" x2="912" y2="330" stroke="#a6bdce" stroke-width="0.6" stroke-dasharray="4 4" stroke-linecap="round" stroke-linejoin="round"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="700" y="132" font-size="12" fill="#2479ad" font-weight="700">LUMINANCE  L  [cd/m²]</text><text x="700" y="150" font-size="12" fill="#26333e">Light leaving one surface</text><text x="700" y="166" font-size="12" fill="#26333e">toward the lens or the eye.</text><text x="680" y="300" font-size="10.5" fill="#607181">A calibrated HDR records L</text><text x="680" y="315" font-size="10.5" fill="#607181">for every pixel of the view.</text></g><g id="hq-note"><text x="40" y="425" font-size="12" fill="#607181">The same daylight gives one E on the desk, but a different L for each surface, depending on its reflectance and the direction of view.</text></g></g></svg>
