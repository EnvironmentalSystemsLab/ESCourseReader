<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" role="img" aria-label="Vertical illuminance at the eye from a fisheye HDR, with a melanopic estimate"><title>Vertical illuminance at the eye from a fisheye HDR, with a melanopic estimate</title><defs><marker id="ue-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#26333e" stroke-width="1.5"/></marker><marker id="ue-arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#2479ad" stroke-width="1.5"/></marker><marker id="ue-arrow-azi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#007c9a" stroke-width="1.5"/></marker><marker id="ue-arrow-third" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#6a4fb3" stroke-width="1.5"/></marker><marker id="ue-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#607181" stroke-width="1.5"/></marker><marker id="ue-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#b13d4c" stroke-width="1.5"/></marker><pattern id="ue-hatch-shadow" patternUnits="userSpaceOnUse" width="3.4" height="3.4" patternTransform="rotate(45)"><rect width="3.4" height="3.4" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="3.4" stroke="#26333e" stroke-width="0.6"/></pattern><pattern id="ue-hatch-shade" patternUnits="userSpaceOnUse" width="7.5" height="7.5" patternTransform="rotate(45)"><rect width="7.5" height="7.5" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7.5" stroke="#26333e" stroke-width="0.6"/></pattern><pattern id="ue-hatch-screen" patternUnits="userSpaceOnUse" width="4.2" height="4.2" patternTransform="rotate(135)"><line x1="0" y1="0" x2="0" y2="4.2" stroke="#26333e" stroke-width="0.6"/></pattern></defs><rect id="ue-background" width="980" height="440" fill="#ffffff"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><g id="ue-fisheye"><text x="40" y="36" font-size="10.5" fill="#26333e" font-weight="700" letter-spacing="1.2">A · EV FROM THE FISHEYE IMAGE</text><circle cx="230" cy="230" r="170" fill="#ffffff" stroke="#26333e" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/><circle cx="230" cy="230" r="28.33" fill="none" stroke="#a6bdce" stroke-width="0.6" stroke-dasharray="3 4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="230" cy="230" r="56.67" fill="none" stroke="#a6bdce" stroke-width="0.6" stroke-dasharray="3 4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="230" cy="230" r="85" fill="none" stroke="#a6bdce" stroke-width="0.6" stroke-dasharray="3 4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="230" cy="230" r="113.33" fill="none" stroke="#a6bdce" stroke-width="0.6" stroke-dasharray="3 4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="230" cy="230" r="141.67" fill="none" stroke="#a6bdce" stroke-width="0.6" stroke-dasharray="3 4" stroke-linecap="round" stroke-linejoin="round"/><line x1="60" y1="230" x2="400" y2="230" stroke="#a6bdce" stroke-width="0.6" stroke-dasharray="3 4" stroke-linecap="round" stroke-linejoin="round"/><line x1="230" y1="60" x2="230" y2="400" stroke="#a6bdce" stroke-width="0.6" stroke-dasharray="3 4" stroke-linecap="round" stroke-linejoin="round"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="234" y="244" font-size="10.5" fill="#007c9a">cos 0° = 1.00</text><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="280.42" y="276.5" font-size="10.5" fill="#007c9a">cos 30° = 0.87</text><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="326.84" y="309.01" font-size="10.5" fill="#007c9a">cos 60° = 0.50</text><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="373.26" y="341.51" font-size="10.5" fill="#007c9a">cos 90° = 0</text><rect x="168.83" y="145.64" width="14" height="14" fill="#ffffff" stroke="#2479ad" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/><line x1="230" y1="230" x2="175.83" y2="152.64" stroke="#6a4fb3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="163.83" y="138.64" font-size="12" fill="#2479ad" text-anchor="end" font-weight="600">pixel i: Li, ωi, θi</text><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="210.91" y="195.32" font-size="10.5" fill="#6a4fb3" font-weight="700">θi</text><text x="230" y="430" font-size="12" fill="#607181" text-anchor="middle">Centre pixels count fully; the rim counts nothing.</text></g><g id="ue-reading"><text x="520" y="36" font-size="10.5" fill="#26333e" font-weight="700" letter-spacing="1.2">B · READ IT AS</text><text x="520" y="66" font-size="12" fill="#26333e">Ev = Σ Li · cos θi · ωi  over the whole hemisphere</text><text x="520" y="84" font-size="12" fill="#26333e">Check it against the lux sensor at the lens (Section 05).</text><text x="520" y="102" font-size="12" fill="#26333e">A large gap points to clipped sources, a cropped view</text><text x="520" y="120" font-size="12" fill="#26333e">or the wrong lens projection.</text><text x="520" y="160" font-size="10.5" fill="#6a4fb3" font-weight="700" letter-spacing="1">MELANOPIC ESTIMATE · APPROXIMATION</text><text x="520" y="182" font-size="12" fill="#26333e">m-EDI ≈ Ev × M-DER of an assumed spectrum</text><text x="520" y="200" font-size="12" fill="#26333e">daylight through glazing: M-DER ≈ 0.9–1.0</text><text x="520" y="218" font-size="12" fill="#26333e">warm-white LED, ~2700 K: roughly 0.4–0.5</text><text x="520" y="236" font-size="12" fill="#26333e">An RGB camera does not measure the spectrum. State the</text><text x="520" y="254" font-size="12" fill="#26333e">assumed source; use a spectrometer for real numbers.</text><rect x="520" y="300" width="248" height="18" fill="#ffffff" stroke="#007c9a" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/><text x="776" y="313" font-size="12" fill="#007c9a" font-weight="600">Ev = 620 lx</text><rect x="520" y="330" width="224" height="18" fill="url(#ue-hatch-screen)" stroke="#6a4fb3" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/><text x="752" y="343" font-size="12" fill="#6a4fb3" font-weight="600">m-EDI ≈ 560 lx (daylight, M-DER 0.9)</text><line x1="620" y1="290" x2="620" y2="360" stroke="#b13d4c" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" stroke-linejoin="round"/><text x="620" y="378" font-size="10.5" fill="#b13d4c" text-anchor="middle">250 lx m-EDI: daytime recommendation (Brown et al. 2022)</text></g></g></svg>
