<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 515" role="img" aria-label="Processing and validation workflow for a calibrated HDR"><title>Processing and validation workflow for a calibrated HDR</title><defs><marker id="hwf-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#26333e" stroke-width="1.5"/></marker><marker id="hwf-arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#2479ad" stroke-width="1.5"/></marker><marker id="hwf-arrow-azi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#007c9a" stroke-width="1.5"/></marker><marker id="hwf-arrow-third" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#6a4fb3" stroke-width="1.5"/></marker><marker id="hwf-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#607181" stroke-width="1.5"/></marker><marker id="hwf-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#b13d4c" stroke-width="1.5"/></marker><pattern id="hwf-hatch-shadow" patternUnits="userSpaceOnUse" width="3.4" height="3.4" patternTransform="rotate(45)"><rect width="3.4" height="3.4" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="3.4" stroke="#26333e" stroke-width="0.6"/></pattern><pattern id="hwf-hatch-shade" patternUnits="userSpaceOnUse" width="7.5" height="7.5" patternTransform="rotate(45)"><rect width="7.5" height="7.5" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7.5" stroke="#26333e" stroke-width="0.6"/></pattern><pattern id="hwf-hatch-screen" patternUnits="userSpaceOnUse" width="4.2" height="4.2" patternTransform="rotate(135)"><line x1="0" y1="0" x2="0" y2="4.2" stroke="#26333e" stroke-width="0.6"/></pattern></defs><rect id="hwf-background" width="990" height="515" fill="#ffffff"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><g id="hwf-workflow"><rect x="30" y="30" width="280" height="132" fill="#ffffff" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="46" y="58" font-size="10.5" fill="#26333e" font-weight="700" letter-spacing="1.2">1 · MERGE</text><text x="46" y="84" font-size="12" fill="#26333e">Read the exposure metadata.</text><text x="46" y="102" font-size="12" fill="#26333e">Align the frames; undo the</text><text x="46" y="120" font-size="12" fill="#26333e">JPEG response curve.</text><rect x="355" y="30" width="280" height="132" fill="#ffffff" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="371" y="58" font-size="10.5" fill="#26333e" font-weight="700" letter-spacing="1.2">2 · LENS</text><text x="371" y="84" font-size="12" fill="#26333e">Set projection and field of view.</text><text x="371" y="102" font-size="12" fill="#26333e">Check the image circle.</text><text x="371" y="120" font-size="12" fill="#26333e">Apply measured vignetting.</text><rect x="680" y="30" width="280" height="132" fill="#ffffff" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="696" y="58" font-size="10.5" fill="#2479ad" font-weight="700" letter-spacing="1.2">3 · CALIBRATE</text><text x="696" y="84" font-size="12" fill="#26333e">Select the measured targets.</text><text x="696" y="102" font-size="12" fill="#26333e">Enter spot readings in cd/m².</text><text x="696" y="120" font-size="12" fill="#26333e">Inspect the fit and residuals.</text><line x1="314" y1="96" x2="350" y2="96" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hwf-arrow-ink)"/><line x1="639" y1="96" x2="675" y2="96" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hwf-arrow-ink)"/><path d="M820,166 V196 H490 V222" fill="none" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hwf-arrow-ink)"/><rect x="260" y="226" width="460" height="98" fill="#ffffff" stroke="#26333e" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/><text x="276" y="254" font-size="10.5" fill="#007c9a" font-weight="700" letter-spacing="1.2">4 · CHECK INDEPENDENT MEASUREMENTS</text><text x="276" y="280" font-size="12" fill="#26333e">Hold out a spot target; compare image Ev with the measured Ev.</text><text x="276" y="298" font-size="12" fill="#26333e">Check clipping, movement, flare and changes in the scene.</text><path d="M400,326 V350 H170 V372" fill="none" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hwf-arrow-ink)"/><path d="M580,326 V350 H810 V372" fill="none" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hwf-arrow-ink)"/><rect x="30" y="376" width="400" height="92" fill="#ffffff" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="46" y="404" font-size="10.5" fill="#26333e" font-weight="700" letter-spacing="1.2">DAYLIGHT / LUMINANCE STUDY</text><text x="46" y="430" font-size="12" fill="#26333e">Compare surfaces and design alternatives.</text><text x="46" y="448" font-size="12" fill="#26333e">Match view, sky and false-color scale.</text><rect x="560" y="376" width="400" height="92" fill="#ffffff" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="576" y="404" font-size="10.5" fill="#26333e" font-weight="700" letter-spacing="1.2">GLARE · FISHEYE REQUIRED</text><text x="576" y="430" font-size="12" fill="#26333e">Calibrated 180° view at the eye position.</text><text x="576" y="448" font-size="12" fill="#26333e">Inspect the sources; DGP with evalglare.</text></g><g id="hwf-note"><text x="30" y="500" font-size="12" fill="#607181">Archive the original exposures, measurement log, lens profile, calibrated HDR, view and analysis settings together.</text></g></g></svg>
