<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 425" role="img" aria-label="Three measurements: spot luminance, eye illuminance and workplane illuminance"><title>Three measurements: spot luminance, eye illuminance and workplane illuminance</title><defs><marker id="hmm-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#26333e" stroke-width="1.5"/></marker><marker id="hmm-arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#2479ad" stroke-width="1.5"/></marker><marker id="hmm-arrow-azi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#007c9a" stroke-width="1.5"/></marker><marker id="hmm-arrow-third" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#6a4fb3" stroke-width="1.5"/></marker><marker id="hmm-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#607181" stroke-width="1.5"/></marker><marker id="hmm-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#b13d4c" stroke-width="1.5"/></marker><pattern id="hmm-hatch-shadow" patternUnits="userSpaceOnUse" width="3.4" height="3.4" patternTransform="rotate(45)"><rect width="3.4" height="3.4" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="3.4" stroke="#26333e" stroke-width="0.6"/></pattern><pattern id="hmm-hatch-shade" patternUnits="userSpaceOnUse" width="7.5" height="7.5" patternTransform="rotate(45)"><rect width="7.5" height="7.5" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7.5" stroke="#26333e" stroke-width="0.6"/></pattern><pattern id="hmm-hatch-screen" patternUnits="userSpaceOnUse" width="4.2" height="4.2" patternTransform="rotate(135)"><line x1="0" y1="0" x2="0" y2="4.2" stroke="#26333e" stroke-width="0.6"/></pattern></defs><rect id="hmm-background" width="990" height="425" fill="#ffffff"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><g id="hmm-spot-luminance"><text x="30" y="36" font-size="10.5" fill="#26333e" font-weight="700" letter-spacing="1.2">A · SPOT LUMINANCE</text><text x="30" y="64" font-size="20" fill="#2479ad" font-weight="700">L  cd/m²</text><text x="30" y="290" font-size="12" fill="#26333e">Aim from near the lens position.</text><text x="30" y="308" font-size="12" fill="#26333e">Keep the whole spot inside one</text><text x="30" y="326" font-size="12" fill="#26333e">uniform matte surface. Repeat</text><text x="30" y="344" font-size="12" fill="#26333e">on several targets.</text><text x="30" y="372" font-size="12" fill="#2479ad" font-weight="600">Sets the image scale.</text><rect x="40" y="130" width="46" height="24" fill="#ffffff" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="86" y="134" width="14" height="16" fill="url(#hmm-hatch-shadow)" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M60,152.51 Q59.87,202.1 60,251.7" fill="none" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><polygon points="100,142 250,124 250,160" fill="#ffffff" stroke="none"/><polygon points="100,142 250,124 250,160" fill="none" stroke="#2479ad" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="250" y="100" width="18" height="84" fill="#ffffff" stroke="#2479ad" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/><rect x="268" y="80" width="10" height="170" fill="url(#hmm-hatch-shadow)" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="250" y="205" font-size="10.5" fill="#2479ad" text-anchor="end">matte target</text></g><g id="hmm-eye-illuminance"><text x="350" y="36" font-size="10.5" fill="#26333e" font-weight="700" letter-spacing="1.2">B · EYE ILLUMINANCE</text><text x="350" y="64" font-size="20" fill="#007c9a" font-weight="700">Ev  lx</text><text x="350" y="290" font-size="12" fill="#26333e">Sensor vertical at the lens, facing</text><text x="350" y="308" font-size="12" fill="#26333e">the view direction. Do not shade</text><text x="350" y="326" font-size="12" fill="#26333e">it. Read before and after the</text><text x="350" y="344" font-size="12" fill="#26333e">bracket.</text><text x="350" y="372" font-size="12" fill="#007c9a" font-weight="600">Checks the hemispheric total.</text><rect x="430" y="120" width="9" height="50" fill="#ffffff" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M434,167.79 Q433.84,209.42 434,251.06" fill="none" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><line x1="600" y1="90" x2="446" y2="128.5" stroke="#007c9a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hmm-arrow-azi)"/><line x1="620" y1="145" x2="446" y2="145" stroke="#007c9a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hmm-arrow-azi)"/><line x1="600" y1="200" x2="446" y2="161.5" stroke="#007c9a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hmm-arrow-azi)"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="560" y="80" font-size="10.5" fill="#007c9a" text-anchor="middle">incoming light</text></g><g id="hmm-workplane-illuminance"><text x="670" y="36" font-size="10.5" fill="#26333e" font-weight="700" letter-spacing="1.2">C · WORKPLANE ILLUMINANCE</text><text x="670" y="64" font-size="20" fill="#007c9a" font-weight="700">E  lx</text><text x="670" y="290" font-size="12" fill="#26333e">Sensor horizontal, facing up, on</text><text x="670" y="308" font-size="12" fill="#26333e">a documented grid at the desk or</text><text x="670" y="326" font-size="12" fill="#26333e">model workplane. Record its</text><text x="670" y="344" font-size="12" fill="#26333e">height and positions.</text><text x="670" y="372" font-size="12" fill="#007c9a" font-weight="600">Tests daylight reaching the task.</text><rect x="690" y="200" width="260" height="8" fill="#ffffff" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M700,205.81 Q700.01,229.35 700,252.89" fill="none" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M940,205.23 Q939.91,228.72 940,252.22" fill="none" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="800" y="191" width="40" height="9" fill="#ffffff" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><line x1="760" y1="100" x2="812.8" y2="186" stroke="#007c9a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hmm-arrow-azi)"/><line x1="820" y1="90" x2="820" y2="186" stroke="#007c9a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hmm-arrow-azi)"/><line x1="880" y1="100" x2="827.2" y2="186" stroke="#007c9a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hmm-arrow-azi)"/></g><g id="hmm-ground"><path d="M25.91,250 Q164.73,249.87 303.55,250" fill="none" stroke="#26333e" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M348.26,250 Q490.24,250.57 632.22,250" fill="none" stroke="#26333e" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M667.04,250 Q815.43,250.19 963.83,250" fill="none" stroke="#26333e" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/><line x1="325" y1="24" x2="325" y2="380" stroke="#a6bdce" stroke-width="0.6" stroke-dasharray="3 4" stroke-linecap="round" stroke-linejoin="round"/><line x1="650" y1="24" x2="650" y2="380" stroke="#a6bdce" stroke-width="0.6" stroke-dasharray="3 4" stroke-linecap="round" stroke-linejoin="round"/></g><g id="hmm-note"><text x="30" y="412" font-size="12" fill="#607181">A lux reading cannot go into a cd/m² calibration field. Match each reading to its image, position, orientation and time.</text></g></g></svg>
