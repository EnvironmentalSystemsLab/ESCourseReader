<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 450" role="img" aria-label="Glare: sources in the fisheye view and the DGP scale"><title>Glare: sources in the fisheye view and the DGP scale</title><defs><marker id="ug-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#26333e" stroke-width="1.5"/></marker><marker id="ug-arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#2479ad" stroke-width="1.5"/></marker><marker id="ug-arrow-azi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#007c9a" stroke-width="1.5"/></marker><marker id="ug-arrow-third" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#6a4fb3" stroke-width="1.5"/></marker><marker id="ug-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#607181" stroke-width="1.5"/></marker><marker id="ug-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#b13d4c" stroke-width="1.5"/></marker><pattern id="ug-hatch-shadow" patternUnits="userSpaceOnUse" width="3.4" height="3.4" patternTransform="rotate(45)"><rect width="3.4" height="3.4" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="3.4" stroke="#26333e" stroke-width="0.6"/></pattern><pattern id="ug-hatch-shade" patternUnits="userSpaceOnUse" width="7.5" height="7.5" patternTransform="rotate(45)"><rect width="7.5" height="7.5" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7.5" stroke="#26333e" stroke-width="0.6"/></pattern><pattern id="ug-hatch-screen" patternUnits="userSpaceOnUse" width="4.2" height="4.2" patternTransform="rotate(135)"><line x1="0" y1="0" x2="0" y2="4.2" stroke="#26333e" stroke-width="0.6"/></pattern></defs><rect id="ug-background" width="980" height="450" fill="#ffffff"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><g id="ug-fisheye"><text x="40" y="36" font-size="10.5" fill="#26333e" font-weight="700" letter-spacing="1.2">A · 180° FISHEYE AT THE EYE, ALONG THE GAZE</text><circle cx="230" cy="250" r="180" fill="#ffffff" stroke="#26333e" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/><circle cx="230" cy="250" r="60" fill="none" stroke="#a6bdce" stroke-width="0.6" stroke-dasharray="3 4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="230" cy="250" r="120" fill="none" stroke="#a6bdce" stroke-width="0.6" stroke-dasharray="3 4" stroke-linecap="round" stroke-linejoin="round"/><line x1="50" y1="250" x2="410" y2="250" stroke="#a6bdce" stroke-width="0.6" stroke-dasharray="3 4" stroke-linecap="round" stroke-linejoin="round"/><line x1="230" y1="70" x2="230" y2="430" stroke="#a6bdce" stroke-width="0.6" stroke-dasharray="3 4" stroke-linecap="round" stroke-linejoin="round"/><path d="M105.29,178 Q145.29,156 173.43,193.43 L157.5,283.81 Q134.68,317.25 94.68,299.25 Z" fill="url(#ug-hatch-screen)" stroke="#b13d4c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="121" cy="210.33" r="9" fill="#ffffff" stroke="#26333e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M132.5,210.33 L136,210.33 M129.13,218.46 L131.6,220.93 M121,221.83 L121,225.33 M112.86,218.46 L110.39,220.93 M109.5,210.33 L106,210.33 M112.86,202.19 L110.39,199.72 M121,198.83 L121,195.33 M129.13,202.19 L131.6,199.72" fill="none" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><line x1="230" y1="250" x2="121" y2="210.33" stroke="#6a4fb3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="171.5" y="218.16" font-size="10.5" fill="#6a4fb3" font-weight="600">P (position)</text><rect x="120" y="350" width="240" height="12" fill="#ffffff" stroke="#26333e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="260" cy="320" r="34" fill="none" stroke="#007c9a" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round" stroke-linejoin="round"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="300" y="324" font-size="10.5" fill="#007c9a" font-weight="600">task zone</text><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="42" y="70" font-size="12" fill="#b13d4c" font-weight="700">glare source: Ls, ωs</text><line x1="92" y1="76" x2="116" y2="156" stroke="#b13d4c" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="238" y="266" font-size="10.5" fill="#607181">view direction</text></g><g id="ug-dgp-scale"><text x="520" y="36" font-size="10.5" fill="#26333e" font-weight="700" letter-spacing="1.2">B · DGP FOR TWO DESIGN MOVES (ILLUSTRATIVE)</text><rect x="520" y="120" width="140" height="26" fill="#ffffff" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="590" y="112" font-size="10.5" fill="#26333e" text-anchor="middle">imperceptible</text><rect x="660" y="120" width="70" height="26" fill="url(#ug-hatch-screen)" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="695" y="112" font-size="10.5" fill="#26333e" text-anchor="middle">perceptible</text><rect x="730" y="120" width="70" height="26" fill="url(#ug-hatch-shade)" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="765" y="112" font-size="10.5" fill="#26333e" text-anchor="middle">disturbing</text><rect x="800" y="120" width="140" height="26" fill="url(#ug-hatch-shadow)" stroke="#26333e" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><text x="870" y="112" font-size="10.5" fill="#26333e" text-anchor="middle">intolerable</text><text x="520" y="162" font-size="10.5" fill="#607181" text-anchor="middle">0.25</text><text x="660" y="162" font-size="10.5" fill="#607181" text-anchor="middle">0.35</text><text x="730" y="162" font-size="10.5" fill="#607181" text-anchor="middle">0.40</text><text x="800" y="162" font-size="10.5" fill="#607181" text-anchor="middle">0.45</text><text x="940" y="162" font-size="10.5" fill="#607181" text-anchor="middle">0.55</text><polygon points="842,148 836,158 848,158" fill="#ffffff" stroke="none"/><polygon points="842,148 836,158 848,158" fill="none" stroke="#6a4fb3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><line x1="842" y1="168" x2="842" y2="174" stroke="#6a4fb3" stroke-width="1" stroke-dasharray="2 3" stroke-linecap="round" stroke-linejoin="round"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="842" y="186" font-size="12" fill="#6a4fb3" text-anchor="end" font-weight="600">A · desk facing the window, clear glass: 0.48</text><polygon points="632,148 626,158 638,158" fill="#ffffff" stroke="none"/><polygon points="632,148 626,158 638,158" fill="none" stroke="#6a4fb3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><line x1="632" y1="168" x2="632" y2="214" stroke="#6a4fb3" stroke-width="1" stroke-dasharray="2 3" stroke-linecap="round" stroke-linejoin="round"/><text paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" x="632" y="226" font-size="12" fill="#6a4fb3" text-anchor="start" font-weight="600">B · desk turned 90°, external blind: 0.33</text><text x="520" y="280" font-size="12" fill="#26333e">Report with DGP: Ev at the lens, and each source’s Ls, ωs and</text><text x="520" y="298" font-size="12" fill="#26333e">position. Source detection in evalglare: luminance above</text><text x="520" y="316" font-size="12" fill="#26333e">5 × the task-zone mean (-T), or a fixed 2,000 cd/m² (-b 2000).</text><text x="520" y="334" font-size="12" fill="#26333e"></text><text x="520" y="352" font-size="12" fill="#26333e">UGR is for electric lighting; ~19 is a common office limit.</text><text x="520" y="370" font-size="12" fill="#26333e">A clipped sun underestimates Ls² ωs, and with it DGP.</text></g></g></svg>
